name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: advice.detachedHead
  GIT_CONFIG_VALUE_0: false
  GIT_CONFIG_KEY_1: init.defaultBranch
  GIT_CONFIG_VALUE_1: main
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/antwika-dev

jobs:
  # The checker scripts and the poker atlas generator are pure Python
  # over the tracked files, so they say the same thing whichever
  # toolchain is installed.
  # They used to run in all three app legs, which was three identical
  # answers paid for three times and none of them before the images had
  # been built.
  # Here they need no container and no image, so they start immediately
  # and a lint failure is reported in seconds rather than in minutes.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Test check-unused-test-doubles script
        shell: bash
        run: python3 scripts/tests/test_check_unused_test_doubles.py

      - name: Check for unused test doubles
        shell: bash
        run: python3 scripts/check_unused_test_doubles.py

      - name: Test check-one-sentence-per-line script
        shell: bash
        run: python3 scripts/tests/test_check_one_sentence_per_line.py

      - name: Check comments and docs are one sentence per line
        shell: bash
        run: python3 scripts/check_one_sentence_per_line.py

      - name: Test check-line-length script
        shell: bash
        run: python3 scripts/tests/test_check_line_length.py

      - name: Check line length
        shell: bash
        run: python3 scripts/check_line_length.py

      - name: Test generate-poker-atlas script
        shell: bash
        run: python3 scripts/tests/test_generate_poker_atlas.py

      - name: Check the poker table's texture atlas is current
        shell: bash
        run: python3 scripts/generate_poker_atlas.py --check

      - name: Test coverage badge script
        shell: bash
        run: python3 scripts/tests/test_generate_coverage_badge.py

      - name: Test check-full-coverage script
        shell: bash
        run: python3 scripts/tests/test_check_full_coverage.py

  build-base:
    name: Base image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish base dev container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/base/Dockerfile
          push: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-base:${{ inputs.version }}
            ${{ inputs.latest && format('{0}/{1}-base:latest', env.REGISTRY, env.IMAGE_PREFIX) || '' }}

  images:
    name: ${{ matrix.name }} image
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LLVM
            image: llvm
            dockerfile: .devcontainer/llvm/Dockerfile
          - name: GNU
            image: gnu
            dockerfile: .devcontainer/gnu/Dockerfile
          - name: MinGW
            image: mingw
            dockerfile: .devcontainer/mingw/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish ${{ matrix.name }} dev container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            BASE_VERSION=${{ inputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ inputs.version }}
            ${{ inputs.latest && format('{0}/{1}-{2}:latest', env.REGISTRY, env.IMAGE_PREFIX, matrix.image) || '' }}

  apps:
    name: ${{ matrix.name }} app(s)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LLVM
            image: llvm
            conan_profile: clang-linux-x86_64
            coverage: true
            gcov_executable: "llvm-cov-21 gcov"
            build_dir: build-coverage
          - name: GNU
            image: gnu
            conan_profile: gcc-linux-x86_64
            coverage: true
            gcov_executable: gcov
            build_dir: build-coverage
          - name: MinGW
            image: mingw
            conan_profile: mingw-windows-x86_64
            coverage: false
            build_dir: build

    container:
      image: ghcr.io/${{ github.repository_owner }}/antwika-dev-${{ matrix.image }}:${{ inputs.version }}
      options: --user root
    env:
      CONAN_PROFILE: ${{ matrix.conan_profile }}
      BUILD_DIR: ${{ matrix.build_dir }}
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 1G
      # Test targets are compiled against a precompiled header, and
      # ccache refuses to cache such a compilation at all unless it is
      # told these two are safe to overlook -- which left 48% of a build
      # uncacheable and cost more than the header saved.
      # time_macros is what makes that safe to accept here: it says a
      # cached object may hold a stale __DATE__/__TIME__, and no file
      # under src/ or backends/ names either.
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ matrix.image }}-${{ hashFiles('conanfile.py', 'conan.lock', format('profiles/build/{0}', matrix.conan_profile), format('profiles/host/{0}', matrix.conan_profile)) }}
          restore-keys: |
            conan-${{ matrix.image }}-

      # A clean build of this project is ~21 CPU-minutes and most pushes
      # change a handful of files, so what the compiler did last time is
      # worth keeping.
      # ccache stores the .gcno beside the object, so an instrumented
      # build caches too -- the notes file embeds the object's absolute
      # path, which is why nothing here moves the build directory around.
      # The GNU leg's 100% coverage gate is what would notice if a
      # cached object ever came back without its instrumentation.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /tmp/ccache
          key: ccache-${{ matrix.image }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.image }}-

      - name: Install dependencies
        shell: bash
        run: |
          conan install . \
            -of build \
            -pr:b=./profiles/build/${CONAN_PROFILE} \
            -pr:h=./profiles/host/${CONAN_PROFILE} \
            --build=missing \
            -s build_type=Release \
            --lockfile=conan.lock

      - name: Configure CMake
        shell: bash
        run: |
          cmake --preset ${{ matrix.coverage && 'conan-coverage' || 'conan-release' }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: cmake --build "$BUILD_DIR" -j24

      - name: Report ccache effectiveness
        shell: bash
        run: ccache --show-stats

      # ctest runs one process per test case and there are over two
      # thousand of them, so this was the single longest step in the
      # pipeline while it ran them one at a time.
      # The instrumented run contends on the .gcda writes, so it scales
      # sublinearly rather than not at all -- and the coverage totals
      # come out identical either way, which is the thing worth knowing.
      - name: Test
        shell: bash
        run: ctest --test-dir "$BUILD_DIR" -j"$(nproc)" --output-on-failure

      # The linearity property is soaked over forty seeds, which costs
      # ~116s under the coverage build's -O0 and under six at -O2.
      # src/apps/tower_defence/tests/CMakeLists.txt is where the two
      # seed counts are chosen; the coverage legs run the eight that
      # reach every branch, and this builds the one target against
      # conan-release to run the wide sweep where it is cheap.
      # It is on the GNU leg alone because a second copy on LLVM would
      # assert the same property about the same generator.
      - name: Soak the level generator
        if: matrix.image == 'gnu'
        shell: bash
        run: |
          cmake --preset conan-release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target antwika_tower_defence_tests -j24
          build/bin/antwika_tower_defence_tests \
            --gtest_filter='LevelGeneratorTest.*'

      - name: Generate coverage report
        if: matrix.coverage
        shell: bash
        run: |
          gcovr \
            --root . \
            --filter 'src/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*/apps/[^/]+/src/main\.cpp' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --gcov-executable '${{ matrix.gcov_executable }}' \
            --print-summary \
            --json-summary --json-summary-pretty \
            -o coverage-summary.json \
            "$BUILD_DIR"

          python3 scripts/generate_coverage_badge.py \
            --summary coverage-summary.json \
            --output coverage-badge.json \
            --label "coverage (${{ matrix.image }})"

      - name: Enforce full coverage (GNU)
        if: matrix.coverage && matrix.image == 'gnu'
        shell: bash
        run: python3 scripts/check_full_coverage.py --summary coverage-summary.json

      - name: Upload coverage badge
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.image }}
          path: coverage-badge.json
          retention-days: 1

      # The list of executables to expect is written by the root
      # CMakeLists.txt, since CMake is what knows which targets exist.
      # A hand-maintained copy here could not tell a new binary from a
      # forgotten one, and the MinGW leg needed a second copy of its own
      # because a cross build configures no test targets.
      - name: Verify executables
        shell: bash
        run: |
          failed=0
          manifest="${BUILD_DIR}/expected-executables.txt"

          if [ ! -s "$manifest" ]; then
            echo "Missing or empty manifest: $manifest"
            exit 1
          fi

          while IFS= read -r binary; do
            if [ ! -f "$binary" ]; then
              echo "Missing binary: $binary"
              failed=1
            else
              echo "Found: $binary"
            fi
          done < "$manifest"

          exit $failed

  backends:
    name: ${{ matrix.name }} backend
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The default build selects the null backends, so nothing above ever
    # compiles a line of backends/sdl3 or backends/raylib. This job is
    # what keeps them from rotting: it builds each real backend and runs
    # the shared conformance suite of every subsystem that backend
    # implements.
    #
    # subsystems is a matrix field rather than a fixed list because
    # raylib implements graphics and input and not sound. Naming what a
    # backend covers is how it opts out honestly, instead of the run
    # steps carrying a special case for one name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SDL3
            backend: sdl3
            subsystems: gfx input sound
            options: -o gfx_backend=sdl3 -o sound_backend=sdl3
          - name: raylib
            backend: raylib
            subsystems: gfx input
            options: -o gfx_backend=raylib

    container:
      image: ghcr.io/${{ github.repository_owner }}/antwika-dev-gnu:${{ inputs.version }}
      options: --user root
    env:
      CONAN_PROFILE: gcc-linux-x86_64
      BUILD_DIR: build-${{ matrix.backend }}
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 1G
      # Test targets are compiled against a precompiled header, and
      # ccache refuses to cache such a compilation at all unless it is
      # told these two are safe to overlook -- which left 48% of a build
      # uncacheable and cost more than the header saved.
      # time_macros is what makes that safe to accept here: it says a
      # cached object may hold a stale __DATE__/__TIME__, and no file
      # under src/ or backends/ names either.
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-gnu-${{ matrix.backend }}-${{ hashFiles('conanfile.py', 'conan.lock', format('conan-{0}.lock', matrix.backend), 'profiles/build/gcc-linux-x86_64', 'profiles/host/gcc-linux-x86_64') }}
          restore-keys: |
            conan-gnu-${{ matrix.backend }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /tmp/ccache
          key: ccache-${{ matrix.backend }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.backend }}-

      # The tracked CMakePresets.json includes build/CMakePresets.json
      # unconditionally, and its conan-coverage preset inherits the
      # conan-release one generated there.
      # CMake refuses to read any preset at all until both exist, so the
      # default configuration has to be installed even though this job
      # builds a different one.
      - name: Install the default configuration, for its presets
        shell: bash
        run: |
          conan install . \
            -of build \
            -pr:b=./profiles/build/${CONAN_PROFILE} \
            -pr:h=./profiles/host/${CONAN_PROFILE} \
            --build=missing \
            -s build_type=Release \
            --lockfile=conan.lock

      - name: Install dependencies
        shell: bash
        run: |
          conan install . \
            -of "$BUILD_DIR" \
            ${{ matrix.options }} \
            -c tools.cmake.cmake_layout:build_folder_vars="['options.gfx_backend']" \
            -pr:b=./profiles/build/${CONAN_PROFILE} \
            -pr:h=./profiles/host/${CONAN_PROFILE} \
            --build=missing \
            -s build_type=Release \
            --lockfile=conan-${{ matrix.backend }}.lock

      - name: Configure CMake
        shell: bash
        run: |
          cmake --preset conan-gfx_backend_${{ matrix.backend }}-release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Only the conformance suites, not the whole project.
      # What this job is for is the backend, and building every app and
      # every test target to reach a handful of binaries was a second
      # full build of everything the app legs had already built.
      - name: Build the conformance suites
        shell: bash
        run: |
          targets=()

          for subsystem in ${{ matrix.subsystems }}; do
            targets+=("antwika_${subsystem}_backend_${{ matrix.backend }}_tests")
          done

          cmake --build "$BUILD_DIR" -j24 --target "${targets[@]}"

      - name: Report ccache effectiveness
        shell: bash
        run: ccache --show-stats

      # Running the binaries is also what checks they exist and that
      # they really asserted something, so there is no separate ctest
      # pass over a build tree that now holds only these two targets.
      - name: Run the conformance suites
        shell: bash
        run: |
          set -o pipefail
          failed=0

          for subsystem in ${{ matrix.subsystems }}; do
            binary="${BUILD_DIR}/bin/antwika_${subsystem}_backend_${{ matrix.backend }}_tests"

            if [ ! -f "$binary" ]; then
              echo "Missing binary: $binary"
              failed=1
              continue
            fi

            log="conformance-${subsystem}.log"

            # Sound runs with no display at all, deliberately.
            # A sound backend that needed Xvfb would be one that had
            # quietly taken a dependency on video, and running it under
            # Xvfb here is exactly what would hide that.
            if [ "$subsystem" = sound ]; then
              runner=(env SDL_AUDIO_DRIVER=dummy)
            else
              runner=(xvfb-run -a)
            fi

            # A failing suite has to fail the step, which the exit
            # status of the pipeline is what reports -- hence pipefail,
            # since tee would otherwise be the one answering.
            if ! "${runner[@]}" "$binary" 2>&1 | tee "$log"; then
              echo "The ${subsystem} conformance suite failed"
              failed=1
            fi

            # A suite that skipped everything would pass while proving
            # nothing, so insist it reported some passes.
            if ! grep -qE '^\[  PASSED  \] [1-9][0-9]* test' "$log"; then
              echo "The ${subsystem} conformance suite passed no tests"
              failed=1
            fi
          done

          exit $failed

  coverage-badges:
    name: Publish coverage badges
    needs: apps
    if: inputs.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
    concurrency:
      group: coverage-badges-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Download coverage badges
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-badge-*
          path: /tmp/coverage-badges

      - name: Publish coverage badges
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/coverage-badges/coverage-badge-gnu/coverage-badge.json /tmp/coverage-gnu.json
          cp /tmp/coverage-badges/coverage-badge-llvm/coverage-badge.json /tmp/coverage-llvm.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges:badges
            git checkout badges
          else
            git checkout --orphan badges
          fi

          git rm -rf . >/dev/null 2>&1 || true

          cp /tmp/coverage-gnu.json coverage-gnu.json
          cp /tmp/coverage-llvm.json coverage-llvm.json
          git add coverage-gnu.json coverage-llvm.json

          if git diff --cached --quiet; then
            echo "No changes to badges"
          else
            git commit -m "chore: update coverage badges [skip ci]"
            git push origin HEAD:badges
          fi
