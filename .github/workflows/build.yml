name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/antwika-dev

jobs:
  build-base:
    name: Build base dev container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish base dev container image(s)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/base/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-base:${{ inputs.version }}
            ${{ inputs.latest && format('{0}/{1}-base:latest', env.REGISTRY, env.IMAGE_PREFIX) }}

  build-llvm:
    name: Build LLVM dev container
    needs: build-base
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish LLVM dev container image(s)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/llvm/Dockerfile
          push: true
          build-args: |
            BASE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-llvm:${{ env.VERSION }}
            ${{ inputs.latest && format('{0}/{1}-llvm:latest', env.REGISTRY, env.IMAGE_PREFIX) }}

  build-gnu:
    name: Build GNU dev container
    needs: build-base
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish GNU dev container image(s)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/gnu/Dockerfile
          push: true
          build-args: |
            BASE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gnu:${{ env.VERSION }}
            ${{ inputs.latest && format('{0}/{1}-gnu:latest', env.REGISTRY, env.IMAGE_PREFIX) }}

  build-mingw:
    name: Build MinGW dev container
    needs: build-base
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish MinGW dev container image(s)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/mingw/Dockerfile
          push: true
          build-args: |
            BASE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mingw:${{ env.VERSION }}
            ${{ inputs.latest && format('{0}/{1}-mingw:latest', env.REGISTRY, env.IMAGE_PREFIX) }}
