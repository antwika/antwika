name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: advice.detachedHead
  GIT_CONFIG_VALUE_0: false
  GIT_CONFIG_KEY_1: init.defaultBranch
  GIT_CONFIG_VALUE_1: main
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/antwika-dev

jobs:
  build-base:
    name: Base image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish base dev container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/base/Dockerfile
          push: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-base:${{ inputs.version }}
            ${{ inputs.latest && format('{0}/{1}-base:latest', env.REGISTRY, env.IMAGE_PREFIX) || '' }}

  images:
    name: ${{ matrix.name }} image
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LLVM
            image: llvm
            dockerfile: .devcontainer/llvm/Dockerfile
          - name: GNU
            image: gnu
            dockerfile: .devcontainer/gnu/Dockerfile
          - name: MinGW
            image: mingw
            dockerfile: .devcontainer/mingw/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish ${{ matrix.name }} dev container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            BASE_VERSION=${{ inputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ inputs.version }}
            ${{ inputs.latest && format('{0}/{1}-{2}:latest', env.REGISTRY, env.IMAGE_PREFIX, matrix.image) || '' }}

  apps:
    name: ${{ matrix.name }} app(s)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LLVM
            image: llvm
            conan_profile: clang-linux-x86_64
            coverage: true
            gcov_executable: "llvm-cov-21 gcov"
            build_dir: build-coverage
          - name: GNU
            image: gnu
            conan_profile: gcc-linux-x86_64
            coverage: true
            gcov_executable: gcov
            build_dir: build-coverage
          - name: MinGW
            image: mingw
            conan_profile: mingw-windows-x86_64
            coverage: false
            build_dir: build

    container:
      image: ghcr.io/${{ github.repository_owner }}/antwika-dev-${{ matrix.image }}:${{ inputs.version }}
      options: --user root
    env:
      CONAN_PROFILE: ${{ matrix.conan_profile }}
      BUILD_DIR: ${{ matrix.build_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Test check-unused-test-doubles script
        shell: bash
        run: python3 scripts/tests/test_check_unused_test_doubles.py

      - name: Check for unused test doubles
        shell: bash
        run: python3 scripts/check_unused_test_doubles.py

      - name: Test check-one-sentence-per-line script
        shell: bash
        run: python3 scripts/tests/test_check_one_sentence_per_line.py

      - name: Check comments and docs are one sentence per line
        shell: bash
        run: python3 scripts/check_one_sentence_per_line.py

      - name: Test check-line-length script
        shell: bash
        run: python3 scripts/tests/test_check_line_length.py

      - name: Check line length
        shell: bash
        run: python3 scripts/check_line_length.py

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ matrix.image }}-${{ hashFiles('conanfile.py', 'conan.lock', format('profiles/build/{0}', matrix.conan_profile), format('profiles/host/{0}', matrix.conan_profile)) }}
          restore-keys: |
            conan-${{ matrix.image }}-

      - name: Install dependencies
        shell: bash
        run: |
          conan install . \
            -of build \
            -pr:b=./profiles/build/${CONAN_PROFILE} \
            -pr:h=./profiles/host/${CONAN_PROFILE} \
            --build=missing \
            -s build_type=Release \
            --lockfile=conan.lock

      - name: Configure CMake
        shell: bash
        run: cmake --preset ${{ matrix.coverage && 'conan-coverage' || 'conan-release' }}

      - name: Build
        shell: bash
        run: cmake --build "$BUILD_DIR" -j24

      - name: Test
        shell: bash
        run: ctest --test-dir "$BUILD_DIR"

      - name: Test coverage badge script
        if: matrix.coverage
        shell: bash
        run: python3 scripts/tests/test_generate_coverage_badge.py

      - name: Test check-full-coverage script
        if: matrix.coverage
        shell: bash
        run: python3 scripts/tests/test_check_full_coverage.py

      - name: Generate coverage report
        if: matrix.coverage
        shell: bash
        run: |
          gcovr \
            --root . \
            --filter 'src/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*/apps/[^/]+/src/main\.cpp' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --gcov-executable '${{ matrix.gcov_executable }}' \
            --print-summary \
            --json-summary --json-summary-pretty \
            -o coverage-summary.json \
            "$BUILD_DIR"

          python3 scripts/generate_coverage_badge.py \
            --summary coverage-summary.json \
            --output coverage-badge.json \
            --label "coverage (${{ matrix.image }})"

      - name: Enforce full coverage (GNU)
        if: matrix.coverage && matrix.image == 'gnu'
        shell: bash
        run: python3 scripts/check_full_coverage.py --summary coverage-summary.json

      - name: Upload coverage badge
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge-${{ matrix.image }}
          path: coverage-badge.json
          retention-days: 1

      - name: Verify executables
        shell: bash
        run: |
          failed=0

          expected=(
            "antwika_ecs_tests"
            "antwika_engine_tests"
            "antwika_event_tests"
            "antwika_game"
            "antwika_game_tests"
            "antwika_life"
            "antwika_life_tests"
            "antwika_log_tests"
            "antwika_reducer_tests"
            "antwika_replay_tests"
            "antwika_scheduler_tests"
            "antwika_sudoku"
            "antwika_sudoku_tests"
            "antwika_task_worker"
            "antwika_task_worker_tests"
            "antwika_time_tests"
            "antwika_wfc_tests"
          )

          if [ "${{ matrix.image }}" = "mingw" ]; then
            extension=".exe"
            expected=("antwika_game" "antwika_life" "antwika_sudoku" "antwika_task_worker")
          else
            extension=""
          fi

          for executable in "${expected[@]}"; do
            binary="${BUILD_DIR}/bin/${executable}${extension}"

            if [ ! -f "$binary" ]; then
              echo "Missing binary: $binary"
              failed=1
            else
              echo "Found: $binary"
            fi
          done

          exit $failed

  coverage-badges:
    name: Publish coverage badges
    needs: apps
    if: inputs.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
    concurrency:
      group: coverage-badges-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Download coverage badges
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-badge-*
          path: /tmp/coverage-badges

      - name: Publish coverage badges
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/coverage-badges/coverage-badge-gnu/coverage-badge.json /tmp/coverage-gnu.json
          cp /tmp/coverage-badges/coverage-badge-llvm/coverage-badge.json /tmp/coverage-llvm.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges:badges
            git checkout badges
          else
            git checkout --orphan badges
          fi

          git rm -rf . >/dev/null 2>&1 || true

          cp /tmp/coverage-gnu.json coverage-gnu.json
          cp /tmp/coverage-llvm.json coverage-llvm.json
          git add coverage-gnu.json coverage-llvm.json

          if git diff --cached --quiet; then
            echo "No changes to badges"
          else
            git commit -m "chore: update coverage badges [skip ci]"
            git push origin HEAD:badges
          fi
