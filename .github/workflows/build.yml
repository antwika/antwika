name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: advice.detachedHead
  GIT_CONFIG_VALUE_0: false
  GIT_CONFIG_KEY_1: init.defaultBranch
  GIT_CONFIG_VALUE_1: main
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/antwika-dev

jobs:
  build-base:
    name: Base image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish base dev container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/base/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-base:${{ inputs.version }}
            ${{ inputs.latest && format('{0}/{1}-base:latest', env.REGISTRY, env.IMAGE_PREFIX) || '' }}

  images:
    name: ${{ matrix.name }} image
    needs: build-base
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LLVM
            image: llvm
            dockerfile: .devcontainer/llvm/Dockerfile
          - name: GNU
            image: gnu
            dockerfile: .devcontainer/gnu/Dockerfile
          - name: MinGW
            image: mingw
            dockerfile: .devcontainer/mingw/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish ${{ matrix.name }} dev container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            BASE_VERSION=${{ inputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ inputs.version }}
            ${{ inputs.latest && format('{0}/{1}-{2}:latest', env.REGISTRY, env.IMAGE_PREFIX, matrix.image) || '' }}

  apps:
    name: ${{ matrix.name }} app(s)
    needs: images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LLVM
            image: llvm
            conan_profile: clang-linux-x86_64
          - name: GNU
            image: gnu
            conan_profile: gcc-linux-x86_64
          - name: MinGW
            image: mingw
            conan_profile: mingw-windows-x86_64

    container:
      image: ghcr.io/${{ github.repository_owner }}/antwika-dev-${{ matrix.image }}:${{ inputs.version }}
      options: --user root
    env:
      CONAN_PROFILE: ${{ matrix.conan_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        shell: bash
        run: |
          conan install . \
            -of build \
            -pr:b=./profiles/build/${CONAN_PROFILE} \
            -pr:h=./profiles/host/${CONAN_PROFILE} \
            --build=missing \
            -s build_type=Release \
            --lockfile=conan.lock

      - name: Configure CMake
        shell: bash
        run: cmake --preset conan-release

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build

      - name: Verify executables
        shell: bash
        run: |
          failed=0

          for dir in build/apps/*/; do
            [ -d "$dir" ] || continue

            app=$(basename "$dir")

            if [ "${{ matrix.image }}" = "mingw" ]; then
              BINARY="$dir$app.exe"
            else
              BINARY="$dir$app"
            fi

            if [ ! -f "$BINARY" ]; then
              echo "Missing binary: $BINARY"
              failed=1
            else
              echo "Found: $BINARY"
            fi
          done

          exit $failed
